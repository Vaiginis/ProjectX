<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="ivio">
  <!-- The i from the wordmark, on a navy tile. Bare on white it reads as
       punctuation at favicon size; the tile gives it a silhouette that still
       registers at 16px, and keeps the green dot as the recognisable signal. -->
  <rect width="100" height="100" rx="24" fill="#042C60"/>
  <circle cx="50" cy="29" r="12" fill="#58CC02"/>
  <rect x="39" y="48" width="22" height="32" rx="11" fill="#FFFFFF"/>
</svg>

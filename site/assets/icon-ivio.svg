<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="ivio">
  <!-- Monogram: a downward triangle with a semicircular bite taken out of its
       top edge, so the void reads as the counter of a v. The bite is cut into
       the outline itself rather than subtracted as a separate subpath — an
       evenodd subtraction would also fill the half of the circle sitting above
       the edge. Apex rounded to match the wordmark's v. -->
  <path fill="#14161A"
        d="M8 26 H27 A23 23 0 0 0 73 26 H92 L58 82 Q50 94 42 82 Z"/>
</svg>

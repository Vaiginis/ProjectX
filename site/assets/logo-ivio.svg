<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 80" width="192" height="80" role="img" aria-label="ivio">
  <!-- One grid throughout: stroke 16 · x-height 54 (y 26→80) · dot radius 9 ·
       dot-to-stem gap 8 · baseline y=80. Stems are pills (rx = half the stroke),
       the o is a true circle drawn as a 16 stroke on radius 19 (outer 27,
       counter 11), and the v is one polygon of constant 16 horizontal
       thickness, 64 wide, so its inner apex lands at half the x-height. -->
  <g fill="#042C60">
    <rect x="0" y="26" width="16" height="54" rx="8"/>
    <!-- v : outer (30,26)->(62,80) and (94,26)->(62,80); inner apex (62,53) -->
    <path d="M30 26 H46 L62 53 L78 26 H94 L69 72 Q62 82 55 72 Z"/>
    <rect x="108" y="26" width="16" height="54" rx="8"/>
    <circle cx="165" cy="53" r="19" fill="none" stroke="#042C60" stroke-width="16"/>
  </g>
  <g fill="#58CC02">
    <circle cx="8" cy="9" r="9"/>
    <circle cx="116" cy="9" r="9"/>
  </g>
</svg>
